[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "drov"
dynamic = ["version"]
description = "A Python agent framework with explicit runtime and inspection contracts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY.md"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.22.1,<0.23",
  "portalocker>=4.4.0,<5",
  "pydantic>=2.14.1,<3",
  "typing-extensions>=4.16.0,<5",
]

# Optional clients and HTTP stack stay outside core imports.
[project.optional-dependencies]
openai = ["openai>=3.29.0,<4"]
e2b = ["e2b==2.56.0"]
mcp = ["mcp==2.3.0"]
server = ["fastapi>=0.143.0,<0.144", "uvicorn>=0.54.0,<0.55"]

[dependency-groups]
dev = [
  "hatchling==1.32.4",
  "httpx>=0.28.1,<0.29",
  "mypy>=2.4.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.17.0,<0.18",
  "twine>=7.0.0,<8",
]

[tool.uv]
required-version = "==0.13.0"

[tool.hatch.version]
path = "src/drov/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/drov"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "scripts", "examples", "evals", "docs", "sandbox", "workbench", "pyproject.toml", "uv.lock",
  "README.md", "AGENTS.md", "LICENSE", "THIRD_PARTY.md", ".python-version",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts", "examples", "evals"]

[[tool.mypy.overrides]]
module = ["openai", "openai.*", "httpx2", "httpx2.*", "e2b", "e2b.*", "httpx", "httpx.*", "mcp", "mcp.*", "jsonschema", "jsonschema.*", "fastapi", "fastapi.*", "starlette", "starlette.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
  "live: requires explicitly configured external service credentials and budget",
  "docker: explicitly configured local Docker sandbox acceptance; never pulls or builds",
]
