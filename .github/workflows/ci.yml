name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked python scripts/generate_schemas.py --check

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: uv sync --locked --extra server
      - run: npm ci
        working-directory: workbench
      - run: npm run schema
        working-directory: workbench
      - run: git diff --exit-code -- workbench/src/schema.d.ts
      - run: npm run format:check
        working-directory: workbench
      - run: npm run build
        working-directory: workbench
      - run: git diff --exit-code -- src/drov/server/static
      - run: npx playwright install --with-deps chromium
        working-directory: workbench
      - run: npm test
        working-directory: workbench

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.11"}
          - {os: macos-latest, python: "3.14"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra server
      - name: HTTP identity, real loopback SSE and file boundaries
        run: uv run --locked --extra server pytest tests/test_http.py tests/test_http_transport.py tests/test_http_artifacts.py tests/test_http_scenarios.py tests/test_workbench.py tests/test_maintenance_http.py
      - run: uv run --locked --extra server python scripts/generate_openapi.py --check
      - run: uv sync --locked --extra mcp
      - name: Real MCP stdio integration
        run: uv run --locked --extra mcp pytest tests/test_mcp_stdio.py
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked python scripts/check_package.py
      - run: uv run --locked twine check --strict dist/*.whl dist/*.tar.gz
      - run: uv sync --locked --all-extras
      - run: uv run --locked --all-extras python -I -B scripts/check_installed.py
      # Each native command is its own step so PowerShell cannot hide an earlier failure.
      - name: Offline official Responses client
        run: uv run --locked --all-extras pytest tests/test_openai_responses.py
      - name: Installed MCP extra and stdio examples
        run: uv run --locked --all-extras python scripts/check_installed_mcp.py --wheel dist/drov-0.1.0a0-py3-none-any.whl
      - name: Installed server extra and real loopback HTTP/SSE examples
        run: uv run --locked --all-extras python scripts/check_installed_server.py --wheel dist/drov-0.1.0a0-py3-none-any.whl
      - name: Offline E2B adapter
        run: uv run --locked --all-extras pytest tests/test_e2b_contracts.py tests/test_e2b.py
      - name: Installed E2B extra without cloud calls
        run: uv run --locked --all-extras python scripts/check_installed_e2b.py --python ${{ matrix.python }} --wheel dist/drov-0.1.0a0-py3-none-any.whl
      - name: Installed Responses extra and loopback examples
        run: uv run --locked --all-extras python scripts/check_installed_openai.py --wheel dist/drov-0.1.0a0-py3-none-any.whl

  python-next:
    # Advisory only; Python 3.15 is not in the supported matrix.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
      - run: uv sync --locked
      - run: uv run --locked pytest
